name: Pubblica aggiornamento

on:
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
          - platform: windows-latest
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Configura Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Installa dipendenze
        run: npm install

      - name: Compila e pubblica
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          retryAttempts: 3
          tagName: registro-presenze-v1.4.8
          releaseName: Registro Presenze v1.4.8
          releaseBody: "Aggiunto il contatore mensile delle ore straordinarie: comprende gli scaglioni completati dopo le 17:00 nei feriali, dopo le 13:00 del sabato e tutte le ore lavorate di domenica. Lo straordinario è conteggiato anche nelle ore effettive, pagato alla tariffa oraria normale e riportato nel PDF e nel CSV. I dati e i backup personali restano invariati."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  correggi-indirizzi-aggiornamento:
    name: Prepara aggiornamento automatico
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: registro-presenze-v1.4.8
      RELEASE_VERSION: 1.4.8
    steps:
      - name: Crea latest.json con i collegamenti diretti
        shell: bash
        run: |
          set -euo pipefail

          assets_json="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets')"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"

          find_asset() {
            local suffix="$1"
            printf '%s' "$assets_json" | jq -c --arg suffix "$suffix" \
              '[.[] | select(.name | endswith($suffix))][0]'
          }

          arm_asset="$(find_asset '_aarch64.app.tar.gz')"
          intel_asset="$(find_asset '_x64.app.tar.gz')"
          windows_asset="$(find_asset '_x64-setup.exe')"

          for asset in "$arm_asset" "$intel_asset" "$windows_asset"; do
            if [[ "$asset" == "null" || -z "$asset" ]]; then
              echo "Manca uno dei pacchetti necessari nella release ${RELEASE_TAG}." >&2
              exit 1
            fi
          done

          read_signature() {
            local package_name="$1"
            local signature_id
            signature_id="$(printf '%s' "$assets_json" | jq -r --arg name "${package_name}.sig" \
              '[.[] | select(.name == $name)][0].id // empty')"
            if [[ -z "$signature_id" ]]; then
              echo "Firma mancante per ${package_name}." >&2
              exit 1
            fi
            gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${signature_id}"
          }

          arm_name="$(printf '%s' "$arm_asset" | jq -r '.name')"
          intel_name="$(printf '%s' "$intel_asset" | jq -r '.name')"
          windows_name="$(printf '%s' "$windows_asset" | jq -r '.name')"
          arm_url="$(printf '%s' "$arm_asset" | jq -r '.browser_download_url')"
          intel_url="$(printf '%s' "$intel_asset" | jq -r '.browser_download_url')"
          windows_url="$(printf '%s' "$windows_asset" | jq -r '.browser_download_url')"
          arm_signature="$(read_signature "$arm_name")"
          intel_signature="$(read_signature "$intel_name")"
          windows_signature="$(read_signature "$windows_name")"
          mkdir -p windows-installer
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$windows_name" --dir windows-installer
          windows_sha256="$(sha256sum "windows-installer/$windows_name" | cut -d ' ' -f 1)"
          release_notes="$(printf '%s' "$release_json" | jq -r '.body // ""')"
          published_at="$(printf '%s' "$release_json" | jq -r '.published_at')"

          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg notes "$release_notes" \
            --arg pub_date "$published_at" \
            --arg arm_url "$arm_url" \
            --arg arm_signature "$arm_signature" \
            --arg intel_url "$intel_url" \
            --arg intel_signature "$intel_signature" \
            --arg windows_url "$windows_url" \
            --arg windows_signature "$windows_signature" \
            --arg windows_sha256 "$windows_sha256" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $arm_signature, url: $arm_url },
                "darwin-x86_64": { signature: $intel_signature, url: $intel_url },
                "windows": {
                  signature: $windows_signature,
                  url: $windows_url,
                  sha256: $windows_sha256
                },
                "windows-x86_64": {
                  signature: $windows_signature,
                  url: $windows_url,
                  sha256: $windows_sha256
                },
                "windows-x86_64-nsis": {
                  signature: $windows_signature,
                  url: $windows_url,
                  sha256: $windows_sha256
                }
              }
            }' > latest.json

          jq -e '
            .platforms
            | to_entries
            | (length == 5)
              and all(.value.url | startswith("https://github.com/"))
              and (map(select(.key == "windows"))[0].value.sha256 | length == 64)
              and (map(select(.key == "windows-x86_64"))[0].value.sha256 | length == 64)
              and (map(select(.key == "windows-x86_64-nsis"))[0].value.sha256 | length == 64)
          ' latest.json >/dev/null

          gh release upload "$RELEASE_TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
